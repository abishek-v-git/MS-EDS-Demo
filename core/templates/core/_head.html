    <script>
        // Theme before first paint (no flash): saved choice, else the OS setting.
        (function () {
            let t = null;
            try { t = localStorage.getItem('eds-theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-bs-theme', t);
            // Collapsed sidebar, also before first paint.
            try { if (localStorage.getItem('eds-sidebar') === 'collapsed') document.documentElement.classList.add('sb-collapsed'); } catch (e) {}
            // Section summary cards folded away.
            try { if (localStorage.getItem('eds-insights') === 'hidden') document.documentElement.classList.add('insights-folded'); } catch (e) {}
        })();
    </script>
